{% extends 'default.html' %}

{% load custom_filters %}

{% block title %}
{{ title }}
{% endblock title %}

{% block content %}

<div class="container">

    <div class="row">
        <div class="text-left">
            <p></p>
        </div>
    </div>

    <form action="" method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">{{ field.label }}</label>
                <div class="col-sm-10">
                    {{ field }}
                </div>
            </div>
        {% endfor %}
        <!-- -->
        <button type="submit" class="btn btn-success">Сохранить</button>
        <!-- -->
        <a href="{{ url_back }}" class="btn btn-primary" role="button">Назад</a>
    </form>

</div>

{% endblock content %}
